stages:
  - build

variables:
  DEBIAN_FRONTEND: noninteractive
  OUTPUT_DIR: ".output"

.uboot-template: &uboot-template
  stage: build
  tags:
    - saas-linux-small-arm64
  image: ubuntu:22.04
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq
      bc bison build-essential
      coccinelle device-tree-compiler dfu-util efitools flex gcc gdisk
      graphviz imagemagick libgnutls28-dev libguestfs-tools liblz4-tool
      libncurses-dev libpython3-dev libsdl2-dev libssl-dev lz4 lzma mkbootimg
      openssl pkg-config python3 python3-asteval python3-coverage
      python3-filelock python3-pkg-resources python3-pycryptodome
      python3-pyelftools python3-pytest python3-pytest-xdist
      python3-sphinx-rtd-theme python3-subunit python3-testtools
      python3-virtualenv swig uuid-dev xxd
    - |
      if [ "$USB_MODE" = "host" ]; then
        sed -i 's/dr_mode = "otg"/dr_mode = "host"/g' dts/upstream/src/arm64/qcom/sm8150-*.dts
      fi

  script:
    - make O=$OUTPUT_DIR $DEFCONFIG $FRAGMENTS
    - make O=$OUTPUT_DIR -j$(nproc)
    - gzip $OUTPUT_DIR/u-boot-nodtb.bin -c > $OUTPUT_DIR/u-boot-nodtb.bin.gz
    - cat $OUTPUT_DIR/u-boot-nodtb.bin.gz $OUTPUT_DIR/dts/upstream/src/arm64/qcom/${DEVICE}.dtb > $OUTPUT_DIR/uboot-dtb
    - mkbootimg --base '0x0' --kernel_offset '0x00008000' --pagesize '4096' --kernel $OUTPUT_DIR/uboot-dtb -o $OUTPUT_DIR/u-boot.img

  artifacts:
    name: "u-boot-${DEVICE}-usb-${USB_MODE}.img"
    paths:
      - $OUTPUT_DIR/u-boot.img
    expire_in: 1 week

build_xiaomi_nabu_host:
  <<: *uboot-template
  variables:
    DEVICE: sm8150-xiaomi-nabu
    USB_MODE: host
    DEFCONFIG: qcom_defconfig
    FRAGMENTS: sm8150-xiaomi-nabu.config

build_xiaomi_nabu_peripheral:
  <<: *uboot-template
  variables:
    DEVICE: sm8150-xiaomi-nabu
    USB_MODE: peripheral
    DEFCONFIG: qcom_defconfig
    FRAGMENTS: sm8150-xiaomi-nabu.config

build_google_flame_host:
  <<: *uboot-template
  variables:
    DEVICE: sm8150-xiaomi-nabu
    USB_MODE: host
    DEFCONFIG: qcom_defconfig
    FRAGMENTS: sm8150-google-flame.config

build_google_flame_peripheral:
  <<: *uboot-template
  variables:
    DEVICE: sm8150-xiaomi-nabu
    USB_MODE: peripheral
    DEFCONFIG: qcom_defconfig
    FRAGMENTS: sm8150-google-flame.config
